name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy after changing NEXT_PUBLIC_* variables (e.g. when the
  # custom domain goes live) without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a deploy that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build:static, not next build: it also runs tooling/post-export.js,
      # which rewrites lang="en" to nl/de on the localized pages.
      # Repo variables, not hardcoded, so moving domains is a settings change.
      # NEXT_PUBLIC_BASE_PATH must be UNSET to serve from the domain root: the
      # API rejects an empty-string variable, and an absent one expands to "".
      # Set it (e.g. /optavius.com) only to serve from a project-pages subpath.
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # out/.nojekyll is a dotfile; the default excludes dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
